  <circle cx="50" cy="35" r="4" fill="#ef4444"/>
  
  <!-- Green Level Indicator / Check -->
  <circle cx="50" cy="65" r="7" fill="#10b981"/>
  <path d="M47 65 L49 67 L53 63" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
