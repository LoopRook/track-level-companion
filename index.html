<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Track Level Companion - Precision live steam & miniature railroad track leveling with laser datum calculations, visual profile graphing, and trackside lift recommendations." />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Track Level Companion</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('track_level_theme_mode');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-zinc-100 text-zinc-900 dark:bg-black dark:text-zinc-100 min-h-screen antialiased selection:bg-amber-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
