<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Track Level Companion - Precision live steam & miniature railroad track leveling with laser datum calculations, visual profile graphing, and trackside lift recommendations." />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Track Level Companion</title>
    <script>
      // Unregister any stale service worker caches from previous build
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var r of regs) { r.unregister(); }
        });
      }
      if (window.caches) {
        caches.keys().then(function(names) {
          for (var n of names) { caches.delete(n); }
        });
      }
    </script>
  </head>
  <body class="bg-zinc-100 text-zinc-900 dark:bg-black dark:text-zinc-100 min-h-screen antialiased selection:bg-amber-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
